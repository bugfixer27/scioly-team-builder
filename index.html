<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverdale SciOly · Team Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23801d32%22/%3E%3Ctext x=%228%22 y=%2212%22 font-size=%2210%22 font-family=%22serif%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23fff%22%3ET%3C/text%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint (no flash). Falls back to prefers-color-scheme.
  (function () { try { var t = localStorage.getItem('tb.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<a class="visually-hidden" href="#main">Skip to content</a>

<header class="topbar">
  <div class="title">Team Builder <small>Riverdale SciOly</small></div>
  <nav class="tabs" aria-label="Views">
    <a href="#board" data-view="board">Board</a>
    <a href="#events" data-view="events">Events</a>
    <a href="#people" data-view="people">People</a>
    <a href="#history" data-view="history">History</a>
    <a href="#settings" data-view="settings">Settings</a>
  </nav>
  <div class="status-cluster">
    <button id="sync-status" class="sync" type="button" aria-live="polite" title="Sync status">Loading…</button>
    <button id="btn-reload" class="btn" type="button" title="Reload from server">Reload</button>
    <button id="btn-save" class="btn primary" type="button" disabled title="Save (⌘S / Ctrl+S)">Save</button>
    <div class="menu">
      <button id="btn-export" class="btn" type="button" aria-haspopup="menu" aria-expanded="false">Export ▾</button>
      <div id="export-menu" class="menu-list" role="menu" hidden>
        <button role="menuitem" data-export="sheet">Export to Sheet</button>
        <hr>
        <button role="menuitem" data-export="roster-json">Download roster.json</button>
        <button role="menuitem" data-export="roster-csv">Download roster.csv</button>
        <button role="menuitem" data-export="events-csv">Download events.csv</button>
        <hr>
        <button role="menuitem" data-export="summary">Copy roster summary</button>
      </div>
    </div>
    <button id="author-chip" class="author-chip" type="button" title="Change your display name">You are: — ✎</button>
  </div>
</header>

<main id="main">
  <div id="global-notices"></div>
  <section id="view-board" class="view" aria-label="Board"></section>
  <section id="view-events" class="view" aria-label="Events"></section>
  <section id="view-people" class="view" aria-label="People"></section>
  <section id="view-history" class="view" aria-label="History"></section>
  <section id="view-settings" class="view" aria-label="Settings"></section>
</main>

<aside id="drawer" class="drawer" aria-label="Person details" aria-hidden="true"></aside>

<dialog id="modal" class="modal"></dialog>
<div id="toasts" class="toasts" aria-live="assertive"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
